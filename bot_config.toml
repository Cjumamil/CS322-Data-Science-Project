# Global bot/runtime settings.
# `version` tracks the overall bot build, separate from individual strategy versions.
[bot]
version = "0.3.0"
run_continuously = true
poll_interval_seconds = 60 # Seconds to wait between full multi-symbol polling cycles.
paper_trading = true
preflight_only = false # When true, print the startup readiness report and exit without trading.

# Execution/mechanical behavior rather than signal logic.
[execution]
order_status_poll_seconds = 2 # How often to re-check submitted orders while waiting on Alpaca.
order_status_timeout_seconds = 30 # Maximum time to wait for order status changes before moving on.
enable_broker_side_stop_loss = true
force_test_trade = false # When true, bypasses strategy signals and forces a manual test trade.
force_direction = "SELL" # BUY enters long or covers short; SELL enters short or exits long.
require_easy_to_borrow_for_short_entries = false # When true, block short entries unless Alpaca also marks the asset easy to borrow.

# Shared risk settings currently applied across all configured symbols.
[risk]
max_position_qty = 0 # Hard cap on shares for a single order. Set to 0 or lower to disable the cap.
risk_fraction_of_buying_power = 0.02 # Fraction of buying power considered when sizing entries.
stop_loss_pct = 0.03
take_profit_pct = 0.06
flatten_before_close = true # Use to prevent holding positions overnight
flatten_minutes_before_close = 5
max_total_position_fraction_of_buying_power = 0.08 # Block new entries when total deployed exposure would exceed this fraction of buying power.

[logging]
enable_full_decision_log = false # Disabled now that the full per-cycle log is too noisy and the historical copy has been archived locally.
enable_full_strategy_context_log = false # Disabled now that the full per-cycle context log is too noisy and the historical copy has been archived locally.
enable_notable_decision_log = true # Keep the compact decision log for real non-HOLD actions.
enable_notable_strategy_context_log = true # Keep the compact strategy-context log for the same non-HOLD action set.

# One `[[accounts]]` block per paper account. Each account has its own
# Alpaca credential environment variable names and its own `[[accounts.symbols]]`
# strategy assignments. This lets the same ticker trade independently in
# separate paper accounts for live strategy comparison.
#
# The `paper_trading` setting below defaults to `[bot].paper_trading`, but it
# can be overridden per account when needed. The top-level legacy `[[symbols]]`
# layout is still supported by the loader as a single default account.
#
# Current paper-trading comparison:
# - `macd_pullback_paper` runs the promoted MACD pullback baseline.
# - `vwap_rsi_paper` runs the VWAP + RSI mean-reversion strategy on a separate
#   paper account. Set PAPER2_ALPACA_API_KEY / PAPER2_ALPACA_SECRET_KEY in `.env`.
# - The MACD account keeps the legacy bare-symbol session-state keys; the VWAP
#   account uses namespaced keys so both accounts can trade the same tickers.

[[accounts]]
name = "macd_pullback_paper"
paper_trading = true
api_key_env = "ALPACA_API_KEY"
secret_key_env = "ALPACA_SECRET_KEY"
state_namespace = ""

[[accounts.symbols]]
ticker = "AAPL"

[accounts.symbols.strategy]
name = "macd_pullback"

[[accounts.symbols]]
ticker = "AMD"

[accounts.symbols.strategy]
name = "macd_pullback"

[[accounts.symbols]]
ticker = "AMZN"

[accounts.symbols.strategy]
name = "macd_pullback"

[[accounts.symbols]]
ticker = "META"

[accounts.symbols.strategy]
name = "macd_pullback"

[[accounts.symbols]]
ticker = "SPY"

[accounts.symbols.strategy]
name = "macd_pullback"

[[accounts.symbols]]
ticker = "QQQ"

[accounts.symbols.strategy]
name = "macd_pullback"

[[accounts.symbols]]
ticker = "IWM"

[accounts.symbols.strategy]
