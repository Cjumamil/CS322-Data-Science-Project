# Global bot/runtime settings.
# `version` tracks the overall bot build, separate from individual strategy versions.
[bot]
version = "0.3.0"
run_continuously = true
poll_interval_seconds = 60 # Seconds to wait between full multi-symbol polling cycles.
paper_trading = true

# Execution/mechanical behavior rather than signal logic.
[execution]
order_status_poll_seconds = 2 # How often to re-check submitted orders while waiting on Alpaca.
order_status_timeout_seconds = 30 # Maximum time to wait for order status changes before moving on.
enable_broker_side_stop_loss = true
force_test_trade = false # When true, bypasses strategy signals and forces a manual test trade.
force_direction = "SELL" # BUY enters long or covers short; SELL enters short or exits long.

# Shared risk settings currently applied across all configured symbols.
[risk]
max_position_qty = 0 # Hard cap on shares for a single order. Set to 0 or lower to disable the cap.
risk_fraction_of_buying_power = 0.02 # Fraction of buying power considered when sizing entries.
stop_loss_pct = 0.03
take_profit_pct = 0.06
flatten_before_close = true # Use to prevent holding positions overnight
flatten_minutes_before_close = 5

# One `[[symbols]]` block per stock. Each symbol currently has one active strategy.
[[symbols]]
ticker = "AAPL"

# Strategy config is nested under the most recent `[[symbols]]` entry.
[symbols.strategy]
name = "sma_crossover"
version = "v1" # Strategy-logic version, separate from the overall bot version.
interval = "1m" # Candle interval used for market data and indicator calculations.
lookback_bars = 1000 # Raw bars requested before indicator warmup rows are dropped.
fast_window = 8 # SMA fast window for the current SMA crossover strategy.
slow_window = 20 # SMA slow window for the current SMA crossover strategy.

[[symbols]]
ticker = "ALB"

[symbols.strategy]
name = "macd_pullback"
version = "v2"

# Candle interval for this symbol only. If you omit --interval in the backtest
# command, the symbol's configured interval here is what gets used.
interval = "5m"

# Number of raw bars to fetch before the analysis window so indicators have
# enough history to warm up.
lookback_bars = 700

# Core EMA and MACD settings used for the local pullback/re-entry logic.
ema_fast_window = 12
ema_slow_window = 26
macd_fast_window = 12
macd_slow_window = 26
macd_signal_window = 9

# EMA band used as the higher-level trend filter and stop placement anchor.
ema_band_window = 200

# Skip the first N bars after the regular market open to avoid the noisiest
# opening candles.
opening_no_trade_bars = 6

# Trend qualification: how many recent bars must stay above/below the EMA200
# band, and over what lookback the band slope is measured.
trend_persistence_lookback = 12
min_bars_above_band_for_long = 8
min_bars_below_band_for_short = 8
trend_slope_lookback = 12
min_ema_band_slope_frac = 0.001

# Sideways-market filter: if too many recent bars sit inside the EMA200 band,
# entries are blocked because trend structure is considered weak/choppy.
sideways_lookback = 12
max_inside_band_bars = 9

# Require a meaningful prior impulse before considering a pullback entry.
require_prior_impulse = true
prior_impulse_lookback = 20
min_prior_impulse_frac_of_price = 0.01

# Pullback memory/filtering: how long we remember a recent trend and pullback,
# and how deep below/above the EMA200 band the pullback is allowed to go.
pullback_memory_bars = 20
max_bars_since_pullback_touch = 8
max_pullback_band_overshoot_frac = 0.002

# MACD context rules: longs only when MACD stays above zero, shorts only when
# it stays below zero.
require_macd_above_zero_for_long = true
require_macd_below_zero_for_short = true

# Re-entry confirmation rules after the pullback.
require_histogram_reexpansion = true # Require histogram to improve in the trade direction.
require_ema12_reclaim = true # Require price back above/below EMA12 before entry.
require_ema26_reclaim = true # Require price back above/below EMA26 before entry.
require_pullback_breakout = false # If true, also require a breakout of the recent pullback range.
pullback_breakout_lookback = 5

# Risk model: stop is placed just beyond the EMA200 band with a small buffer,
# and target is measured as a multiple of that risk distance.
ema_stop_buffer_pct = 0.001
take_profit_risk_multiple = 1.5
max_stop_distance_frac_of_price = 0.04 # Reject setups whose stop would be too far from entry.

# Optional strategy-managed exits.
enable_time_stop = true # Force an exit after max_bars_in_trade if the trade stalls.
max_bars_in_trade = 30
enable_macd_failure_exit = false # Exit early if MACD flips back against the trade.
min_bars_before_macd_exit = 4

[[symbols]]
ticker = "MSFT"

[symbols.strategy]
name = "macd_pullback"
version = "v2"
interval = "5m"
lookback_bars = 700
ema_fast_window = 12
ema_slow_window = 26
macd_fast_window = 12
macd_slow_window = 26
macd_signal_window = 9
ema_band_window = 200
opening_no_trade_bars = 6
trend_persistence_lookback = 12
min_bars_above_band_for_long = 8
min_bars_below_band_for_short = 8
trend_slope_lookback = 12
min_ema_band_slope_frac = 0.001
sideways_lookback = 12
max_inside_band_bars = 9
require_prior_impulse = true
prior_impulse_lookback = 20
min_prior_impulse_frac_of_price = 0.01
pullback_memory_bars = 20
max_bars_since_pullback_touch = 8
max_pullback_band_overshoot_frac = 0.002
require_macd_above_zero_for_long = true
require_macd_below_zero_for_short = true
require_histogram_reexpansion = true
require_ema12_reclaim = true
require_ema26_reclaim = true
require_pullback_breakout = false
pullback_breakout_lookback = 5
ema_stop_buffer_pct = 0.001
take_profit_risk_multiple = 1.5
max_stop_distance_frac_of_price = 0.02
enable_time_stop = false
max_bars_in_trade = 18
enable_macd_failure_exit = false
min_bars_before_macd_exit = 4

